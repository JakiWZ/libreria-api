# Configurazione usata SOLO durante i test.
# Database H2 in memoria: i test girano senza bisogno di un PostgreSQL attivo.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le tabelle vengono create da Hibernate a partire dalle entity; Flyway non serve nei test.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
